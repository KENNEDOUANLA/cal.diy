# Override de dev pour calcom-api : monte le code en volume et tourne en mode
# --watch (nest/webpack recompile en quelques secondes) au lieu de rebuild toute
# l'image Docker à chaque changement. Fichier machine-specific, non commité
# (même esprit que docker-compose.override.yml) — voir git status avant un `git add -A`.
#
# Usage (inclut toujours override.yml, qui déclare le réseau "proxy" externe) :
#   docker compose stop calcom-api
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.dev.yml up calcom-api-dev
#
# Première fois (install + build des packages partagés, un peu long) puis les
# sauvegardes suivantes dans apps/api/v2/src ne redéclenchent qu'un recompile
# incrémental. Si tu modifies packages/platform/* (rare), relance
# `yarn workspace @calcom/api-v2 run dev:build` dans le conteneur.
#
# Pour revenir en "prod-like" : Ctrl+C, puis `docker compose up -d calcom-api`.

volumes:
  calcom_api_dev_node_modules:

services:
  calcom-api-dev:
    container_name: calcom-api-dev
    image: node:20-alpine
    working_dir: /calcom
    command: >
      sh -c "ln -sf /usr/lib/libssl.so.3 /lib/libssl.so.3 &&
             yarn install &&
             yarn workspace @calcom/api-v2 run dev:no-docker"
    volumes:
      - .:/calcom
      # node_modules dédiés au conteneur (pas celui de ton host, évite les soucis
      # de binaires natifs compilés pour une autre plateforme) :
      - calcom_api_dev_node_modules:/calcom/node_modules
    networks:
      - stack
      - proxy
    ports:
      - "${API_PORT:-3002}:${API_PORT:-3002}"
    labels:
      # Mêmes labels que calcom-api dans docker-compose.override.yml : Traefik route vers
      # le conteneur actif (prod OU dev) — ne jamais lancer les deux en même temps.
      - "traefik.enable=true"
      - "traefik.http.routers.cal-diy-api.entrypoints=websecure"
      - "traefik.http.routers.cal-diy-api.rule=Host(`api.booking.gesticarros.com`)"
      - "traefik.http.routers.cal-diy-api.tls=true"
      - "traefik.http.routers.cal-diy-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.cal-diy-api.loadbalancer.server.port=3002"
    env_file: .env
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=8192
      - API_PORT=${API_PORT:-3002}
      - API_URL=${API_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}/${POSTGRES_DB}
      - DATABASE_READ_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}/${POSTGRES_DB}
      - DATABASE_WRITE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - API_KEY_PREFIX=${API_KEY_PREFIX}
      - WEB_APP_URL=${WEB_APP_URL}
      - IS_E2E=${IS_E2E:-false}
      - REWRITE_API_V2_PREFIX=${REWRITE_API_V2_PREFIX:-true}
      - CALCOM_LICENSE_KEY=${CALCOM_LICENSE_KEY}
    depends_on:
      - database
      - redis
